server:
  host: ""
  port: 8080
  mode: debug
  shutdown_timeout: 10s

postgres:
  host: localhost
  port: 5432
  database: pagination
  user: postgres
  password: pagination
  sslmode: disable
  min_conns: 2
  max_conns: 10

logging:
  # debug ajoute une ligne par requête SQL : l'énoncé, ses arguments et sa
  # durée, via le traceur pgx. C'est le seul interrupteur — il n'y a pas de
  # réglage dédié. Les arguments sont donc journalisés, filtres du client
  # compris : à réserver au diagnostic.
  level: debug
  format: text

cursor:
  # Development key. In production it comes from the environment, never from a
  # committed file: PAGINATION_CURSOR__KEY=...
  key: concevoir-une-api-paginee-dev-key
  # 72 hours of resumable position. Past it, a well-formed cursor answers 410
  # and the client restarts its walk.
  ttl: 72h
